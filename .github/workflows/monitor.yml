name: Async Uptime & SSL Monitor

on:
  schedule:
    - cron: '*/10 6-23 * * *'  # Runs automatically every 5 minutes
  push:
    branches:
      - main               # Runs immediately on new commits/pushes
  workflow_dispatch:        # Allows manual run from GitHub Actions UI

jobs:
  run-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install aiohttp

      - name: Run Health Checks
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TARGET_URLS: ${{ secrets.TARGET_URLS }}
        run: python monitor.py
